<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollectListe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e3f;
  --accent:#7c6af7;--accent2:#a78bfa;--text:#e2e2f0;--text2:#8888aa;
  --green:#4ade80;--red:#f87171;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
a{color:var(--accent2)}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select{font-family:inherit}
#home,#list-view{min-height:100vh}
.hidden{display:none!important}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;background:var(--surface)}
.header-left{display:flex;align-items:center;gap:10px}
.header h1{font-size:1.1rem;font-weight:900;letter-spacing:-0.5px}
.header p{font-size:0.72rem;color:var(--text2)}
.btn-primary{background:var(--accent);color:#fff;padding:8px 16px;border-radius:10px;font-size:0.85rem;font-weight:700;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--surface2);color:var(--text2);padding:8px 16px;border-radius:10px;font-size:0.85rem;border:1px solid var(--border)}

/* Cards */
.main{max-width:1100px;margin:0 auto;padding:24px 20px}
.section-label{font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:left;transition:filter .15s,transform .15s;width:100%}
.card:hover{filter:brightness(1.12);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-icon{font-size:1.8rem}
.card-badge{font-size:0.7rem;padding:3px 8px;border-radius:20px;font-weight:600}
.card h3{font-size:0.95rem;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .desc{font-size:0.75rem;color:var(--text2);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-stats{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text2);margin-bottom:6px}
.card-pct{font-weight:700}
.progress-bar{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width .4s}
.card-add{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;border:2px dashed var(--border);color:var(--text2)}
.card-add span:first-child{font-size:1.8rem;margin-bottom:4px}
.card-add span:last-child{font-size:0.85rem}

/* List view */
.lv-header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;background:var(--surface)}
.back-btn{font-size:0.85rem;color:var(--text2);font-weight:600}
.back-btn:hover{color:var(--text)}
.lv-title{font-size:1rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-danger{background:var(--surface2);color:var(--red);padding:6px 12px;border-radius:8px;font-size:0.78rem;border:1px solid var(--border)}
.lv-body{max-width:1400px;margin:0 auto;padding:20px}

/* Progress */
.progress-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.progress-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.prog-desc{font-size:0.8rem;color:var(--text2);margin-bottom:2px}
.prog-count{font-size:1.5rem;font-weight:800}
.prog-count span{font-size:0.9rem;font-weight:400;color:var(--text2)}
.prog-pct{font-size:2rem;font-weight:900;color:var(--accent2)}
.progress-bar-lg{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress-fill-lg{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search-input{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-size:0.85rem;outline:none}
.search-input:focus{border-color:var(--accent)}
.filter-group{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.filter-btn{padding:8px 12px;font-size:0.82rem;background:var(--surface);color:var(--text2)}
.filter-btn.active{background:var(--accent);color:#fff}

/* Add form */
.add-form{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:16px;margin-bottom:14px}
.add-form-title{font-size:0.85rem;font-weight:600;color:var(--accent);margin-bottom:12px}
.add-form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.field-group label{display:block;font-size:0.72rem;color:var(--text2);margin-bottom:4px}
.field-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:0.82rem;outline:none}
.add-form-actions{display:flex;gap:8px}

/* Table */
.table-wrap{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border)}
th{padding:10px 12px;text-align:left;white-space:nowrap;color:var(--text2);font-weight:600;user-select:none;cursor:pointer}
th:hover{color:var(--text)}
th.sorted{color:var(--accent2)}
tbody tr{border-bottom:1px solid var(--border);transition:filter .1s;cursor:pointer}
tbody tr:nth-child(even){background:var(--surface2)}
tbody tr:nth-child(odd){background:var(--surface)}
tbody tr:hover{filter:brightness(1.15)}
tbody tr.completed-row{opacity:.5}
td{padding:9px 12px;vertical-align:middle}
td.check-cell{width:36px;text-align:center}
.check-box{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;border:2px solid var(--border);transition:all .15s;flex-shrink:0}
.check-box.done{background:var(--green);border-color:var(--green);color:#000;font-size:10px;font-weight:900}
.check-box.partial{border-color:var(--accent2);background:var(--accent2)22}
td.truncate{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.strike{text-decoration:line-through;color:var(--text2)}

/* Expand row */
.expand-row td{background:var(--surface2)!important;filter:none!important}
.expand-inner{padding:4px 0 10px}
.expand-meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.expand-field-label{font-size:0.7rem;color:var(--text2);font-weight:600;margin-bottom:2px}
.expand-field-val{font-size:0.82rem;color:var(--text)}

/* Issue checklist */
.issues-section{margin-bottom:12px}
.issues-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.issues-label{font-size:0.78rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.issues-prog{font-size:0.75rem;color:var(--accent2);font-weight:600}
.issues-grid{display:flex;flex-wrap:wrap;gap:6px}
.issue-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:0.75rem;color:var(--text2);cursor:pointer;transition:all .12s;user-select:none}
.issue-chip:hover{border-color:var(--accent2);color:var(--text)}
.issue-chip.done{background:var(--green)18;border-color:var(--green)66;color:var(--green)}
.issue-chip .mini-check{width:13px;height:13px;border-radius:3px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;flex-shrink:0}
.issue-chip.done .mini-check{background:var(--green);border-color:var(--green);color:#000}

.expand-actions{display:flex;gap:8px;margin-top:4px}
.btn-complete{padding:5px 12px;border-radius:8px;font-size:0.78rem;font-weight:700;background:var(--green);color:#000}
.btn-incomplete{padding:5px 12px;border-radius:8px;font-size:0.78rem;font-weight:700;background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.btn-del-item{padding:5px 12px;border-radius:8px;font-size:0.78rem;color:var(--red);border:1px solid var(--border);background:var(--surface)}
.btn-check-all{padding:5px 12px;border-radius:8px;font-size:0.78rem;color:var(--accent2);border:1px solid var(--border);background:var(--surface)}

.table-footer{font-size:0.75rem;color:var(--text2);margin-top:8px}

/* Modals */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:1.1rem;font-weight:800}
.modal-close{font-size:1.4rem;color:var(--text2);line-height:1}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:0.8rem;color:var(--text2);font-weight:500;margin-bottom:5px}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:9px;font-size:0.85rem;outline:none}
.form-input:focus{border-color:var(--accent)}
.category-pills{display:flex;flex-wrap:wrap;gap:8px}
.cat-pill{padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text2)}
.cat-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.fields-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fields-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;padding-right:2px}
.field-row{display:flex;gap:6px;align-items:center}
.field-row input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:0.82rem;outline:none}
.field-row select{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:6px 8px;border-radius:8px;font-size:0.78rem;outline:none}
.btn-rm{color:var(--red);font-size:1rem;padding:0 4px}
.modal-footer{display:flex;gap:10px;margin-top:20px}
.modal-footer button{flex:1;padding:10px;border-radius:12px;font-size:0.88rem;font-weight:700}
.confirm-modal{max-width:360px}
.confirm-modal p{font-size:0.88rem;color:var(--text2);margin:10px 0 20px}

@media(max-width:600px){
  .cards{grid-template-columns:1fr}
  .expand-meta{grid-template-columns:1fr 1fr}
  .issues-grid{gap:5px}
}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <header class="header">
    <div class="header-left">
      <span style="font-size:1.5rem">📋</span>
      <div><h1>CollectListe</h1><p>Your collection &amp; completion tracker</p></div>
    </div>
    <button class="btn-primary" onclick="openCreateModal()">+ New Collection</button>
  </header>
  <div class="main">
    <div class="section-label" id="home-label">Your Collections</div>
    <div class="cards" id="cards-grid"></div>
  </div>
</div>

<!-- LIST VIEW -->
<div id="list-view" class="hidden">
  <header class="lv-header">
    <button class="back-btn" onclick="showHome()">← Back</button>
    <span style="color:var(--border);margin:0 4px">|</span>
    <span id="lv-icon" style="font-size:1.3rem"></span>
    <span class="lv-title" id="lv-title"></span>
    <button class="btn-danger" onclick="confirmDeleteCollection()">Delete</button>
  </header>
  <div class="lv-body">
    <div class="progress-section">
      <div class="progress-row">
        <div>
          <div class="prog-desc" id="lv-desc"></div>
          <div class="prog-count" id="lv-count"></div>
        </div>
        <div class="prog-pct" id="lv-pct"></div>
      </div>
      <div class="progress-bar-lg"><div class="progress-fill-lg" id="lv-fill"></div></div>
    </div>
    <div class="controls">
      <input class="search-input" type="text" placeholder="Search…" id="search-input" oninput="renderTable()">
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
      </div>
      <button class="btn-primary" onclick="toggleAddForm()">+ Add Item</button>
    </div>
    <div class="add-form hidden" id="add-form">
      <div class="add-form-title">New Item</div>
      <div class="add-form-grid" id="add-form-fields"></div>
      <div class="add-form-actions">
        <button class="btn-primary" onclick="saveNewItem()">Save</button>
        <button class="btn-secondary" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table id="main-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
    <div class="table-footer" id="table-footer"></div>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="modal-backdrop hidden" id="create-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>New Collection</h2>
      <button class="modal-close" onclick="closeCreateModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="new-name" placeholder="e.g. Gaming Backlog 2026">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input class="form-input" id="new-desc" placeholder="Optional description">
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <div class="category-pills">
        <button class="cat-pill active" data-cat="reading" onclick="selectCat(this)">📚 Reading</button>
        <button class="cat-pill" data-cat="gaming" onclick="selectCat(this)">🎮 Gaming</button>
        <button class="cat-pill" data-cat="watching" onclick="selectCat(this)">🎬 Watching</button>
        <button class="cat-pill" data-cat="music" onclick="selectCat(this)">🎵 Music</button>
        <button class="cat-pill" data-cat="other" onclick="selectCat(this)">📋 Other</button>
      </div>
    </div>
    <div class="form-group">
      <div class="fields-header">
        <label class="form-label" style="margin:0">Columns</label>
        <button class="btn-primary" style="padding:4px 10px;font-size:0.75rem" onclick="addFieldRow()">+ Column</button>
      </div>
      <div class="fields-list" id="new-fields-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
      <button class="btn-primary" onclick="createCollection()">Create</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="modal-backdrop hidden" id="confirm-modal">
  <div class="modal confirm-modal">
    <div class="modal-header">
      <h2>Delete collection?</h2>
      <button class="modal-close" onclick="closeConfirm()">×</button>
    </div>
    <p id="confirm-text"></p>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button style="background:var(--red);color:#fff" onclick="deleteCollection()">Delete</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'collectliste-v1';
const CAT_ICONS = {reading:'📚',gaming:'🎮',watching:'🎬',music:'🎵',other:'📋'};
const CAT_COLORS = {reading:'#7c6af7',gaming:'#34d399',watching:'#f59e0b',music:'#f472b6',other:'#94a3b8'};

const MARVEL_FIELDS = [
  {key:'pub_order',label:'#',type:'number'},
  {key:'storyline',label:'Storyline',type:'text'},
  {key:'franchise',label:'Franchise',type:'text'},
  {key:'issues',label:'Issues',type:'text'},
  {key:'years',label:'Year(s)',type:'text'},
  {key:'creators',label:'Creators',type:'text'},
  {key:'why_essential',label:'Why Essential',type:'text'},
  {key:'bestof_rank',label:'Best-Of Rank',type:'number'},
];

const MARVEL_SEED = [{"id":"marvel-1","completed":false,"pub_order":1,"storyline":"The Galactus Trilogy","franchise":"Fantastic Four","issues":"Fantastic Four #48–50","years":"1966","creators":"Stan Lee / Jack Kirby","why_essential":"Introduces Galactus and the Silver Surfer; frequently cited as the greatest superhero comic ever made.","bestof_rank":29},{"id":"marvel-2","completed":false,"pub_order":2,"storyline":"This Man, This Monster","franchise":"Fantastic Four","issues":"Fantastic Four #51","years":"1966","creators":"Stan Lee / Jack Kirby","why_essential":"A stand-alone Thing-centric issue widely considered one of the finest single issues in the medium's history.","bestof_rank":30},{"id":"marvel-3","completed":false,"pub_order":3,"storyline":"The Kree-Skrull War","franchise":"Avengers","issues":"Avengers #89–97","years":"1971–1972","creators":"Roy Thomas / Sal Buscema, Neal Adams","why_essential":"Sprawling cosmic epic that established the scale of Marvel's space-opera side and the Kree/Skrull galactic conflict.","bestof_rank":21},{"id":"marvel-4","completed":false,"pub_order":4,"storyline":"The Night Gwen Stacy Died","franchise":"Spider-Man","issues":"Amazing Spider-Man #121–122","years":"1973","creators":"Gerry Conway / Gil Kane","why_essential":"The story that ended comics' Silver Age innocence; Gwen Stacy's death remains a genre-defining moment.","bestof_rank":14},{"id":"marvel-5","completed":false,"pub_order":5,"storyline":"The Korvac Saga","franchise":"Avengers","issues":"Avengers #167–177 (Thor Annual #7 and Marvel Team-Up #69–70 as optional tie-ins)","years":"1978","creators":"Jim Shooter, David Michelinie / George Perez","why_essential":"Classic cosmic-scale Avengers epic pitting the team against a god-like former villain; a 70s fan favorite.","bestof_rank":53},{"id":"marvel-6","completed":false,"pub_order":6,"storyline":"Demon in a Bottle","franchise":"Iron Man","issues":"Iron Man #120–128","years":"1979","creators":"David Michelinie, Bob Layton / Joh // ── Issue parser ───────────────────────────────────────────────
// Parses "Series #X–Y, Other #A–B" into [{label, done}] arrays
function parseIssues(issueStr) {
  // Strip parenthetical notes
  let s = issueStr.replace(/\([^)]*\)/g, ' ').replace(/\s+/g,' ').trim();
  const result = [];
  // Split on commas/semicolons
  const segments = s.split(/[;,]/);
  for (let seg of segments) {
    seg = seg.trim();
    if (!seg) continue;
    // Range: "Series #X–Y" or "Series #X-Y"
    const rangeM = seg.match(/^(.+?)\s*#\s*(\d+)\s*[–\-]\s*(\d+)$/);
    if (rangeM) {
      const series = rangeM[1].trim();
      const from = parseInt(rangeM[2]), to = parseInt(rangeM[3]);
      if (to - from < 60) { // sanity cap
        for (let n = from; n <= to; n++) result.push({label:`${series} #${n}`, done:false});
      } else {
        result.push({label: seg, done:false});
      }
      continue;
    }
    // Single: "Series #X" or "Series #X (descriptor)"
    const singleM = seg.match(/^(.+?)\s*#\s*(\d+)/);
    if (singleM) {
      result.push({label:`${singleM[1].trim()} #${singleM[2]}`, done:false});
      continue;
    }
    // Fallback: keep as-is if non-trivial
    if (seg.length > 2) result.push({label: seg, done:false});
  }
  return result.length > 0 ? result : null;
}

// Ensure item has subIssues populated from its issues field
function ensureSubIssues(item) {
  if (!item.subIssues) {
    item.subIssues = parseIssues(item.issues || '') || [];
  }
}

const WCW_COLLECTION = {
  id:'wcw-ppv-history', name:'WCW PPV History (1988–2001)',
  description:'Every WCW/NWA pay-per-view from Starrcade 1988 through Greed 2001.',
  category:'watching', icon:'🏆',
  fields: PPV_FIELDS, items: WCW_ITEMS,
  sortField:'num', sortDir:'asc'
};

// ── State ──────────────────────────────────────────────────────
let collections = [];
let activeId = null;
let sortField = 'pub_order';
let sortDir = 'asc';
let filterMode = 'all';
let expandedId = null;

// ── Persistence ────────────────────────────────────────────────
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); }
function load() {
  try { const d = localStorage.getItem(STORAGE_KEY); if (d) collections = JSON.parse(d); } catch{}
  // Seed Marvel if missing
  if (!collections.find(c=>c.id==='marvel-top-100')) {
    collections.unshift({
      id:'marvel-top-100', name:'Marvel Top 100 Story Arcs',
      description:'Greatest Marvel story arcs in publication order.',
      category:'reading', icon:'📚',
      fields: MARVEL_FIELDS, items: MARVEL_SEED,
      sortField:'pub_order', sortDir:'asc'
    });
    save();
  }
  // Seed Mario if missing
  if (!collections.find(c=>c.id==='mario-franchise')) {
    collections.push(MARIO_COLLECTION);
    save();
  }
  // Seed Steam library if missing
  if (!collections.find(c=>c.id==='steam-library')) {
    collections.push(STEAM_COLLECTION);
    save();
  }
  // Seed WWF/WWE PPV if missing
  if (!collections.find(c=>c.id==='wwf-ppv-history')) {
    collections.push(WWF_COLLECTION);
    save();
  }
  // Seed WCW PPV if missing
  if (!collections.find(c=>c.id==='wcw-ppv-history')) {
    collections.push(WCW_COLLECTION);
    save();
  }
}

function uid() { return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Home ───────────────────────────────────────────────────────
function showHome() {
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('list-view').classList.add('hidden');
  activeId = null;
  renderHome();
}

function renderHome() {
  const grid = document.getElementById('cards-grid');
  document.getElementById('home-label').textContent = `Your Collections (${collections.length})`;
  grid.innerHTML = '';
  for (const c of collections) {
    const done = c.items.filter(i=>i.completed).length;
    const total = c.items.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const color = CAT_COLORS[c.category]||CAT_COLORS.other;
    const card = document.createElement('button');
    card.className = 'card';
    card.onclick = () => openCollection(c.id);
    card.innerHTML = `
      <div class="card-top">
        <span class="card-icon">${c.icon}</span>
        <span class="card-badge" style="background:${color}22;color:${color}">${c.category}</span>
      </div>
      <h3>${esc(c.name)}</h3>
      ${c.description?`<p class="desc">${esc(c.description)}</p>`:'<p class="desc">&nbsp;</p>'}
      <div class="card-stats"><span>${done} / ${total} completed</span><span class="card-pct" style="color:${color}">${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
    `;
    grid.appendChild(card);
  }
  const add = document.createElement('button');
  add.className = 'card card-add';
  add.onclick = openCreateModal;
  add.innerHTML = '<span>+</span><span>New Collection</span>';
  grid.appendChild(add);
}

// ── Collection view ────────────────────────────────────────────
function openCollection(id) {
  activeId = id;
  const c = getActive();
  sortField = c.sortField || c.fields[0].key;
  sortDir = c.sortDir || 'asc';
  filterMode = 'all';
  expandedId = null;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  document.getElementById('lv-icon').textContent = c.icon;
  document.getElementById('lv-title').textContent = c.name;
  document.getElementById('lv-desc').textContent = c.description;
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.getElementById('add-form').classList.add('hidden');
  buildAddForm();
  renderTable();
  updateProgress();
}

function getActive() { return collections.find(c=>c.id===activeId); }

function updateProgress() {
  const c = getActive();
  const done = c.items.filter(i=>i.completed).length;
  const total = c.items.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('lv-count').innerHTML = `${done} <span>/ ${total} completed</span>`;
  document.getElementById('lv-pct').textContent = pct+'%';
  document.getElementById('lv-fill').style.width = pct+'%';
}

function setFilter(mode, btn) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function getDisplayedItems() {
  const c = getActive();
  const q = document.getElementById('search-input').value.toLowerCase();
  let items = c.items.filter(i => {
    if (filterMode==='completed' && !i.completed) return false;
    if (filterMode==='pending' && i.completed) return false;
    if (q) return c.fields.some(f => String(i[f.key]||'').toLowerCase().includes(q));
    return true;
  });
  items.sort((a,b) => {
    const av=a[sortField]??'', bv=b[sortField]??'';
    const an=Number(av), bn=Number(bv);
    const cmp = !isNaN(an)&&!isNaN(bn) ? an-bn : String(av).localeCompare(String(bv));
    return sortDir==='asc'?cmp:-cmp;
  });
  return items;
}

function renderTable() {
  const c = getActive();
  const mainFields = c.fields.slice(0,5);
  const extraFields = c.fields.slice(5);
  const items = getDisplayedItems();

  // Header
  document.getElementById('table-head').innerHTML = '<tr>' +
    '<th style="width:36px;cursor:default"></th>' +
    mainFields.map(f=>`<th class="${sortField===f.key?'sorted':''}" onclick="toggleSort('${f.key}')">${esc(f.label)}${sortField===f.key?(sortDir==='asc'?' ↑':' ↓'):''}</th>`).join('') +
    (extraFields.length?'<th style="width:40px;cursor:default">▾</th>':'') +
    '<th style="width:32px;cursor:default"></th>' +
    '</tr>';

  const body = document.getElementById('table-body');
  body.innerHTML = '';

  if (!items.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="${mainFields.length+3}" style="text-align:center;padding:24px;color:var(--text2)">No items match.</td>`;
    body.appendChild(tr); return;
  }

  for (const item of items) {
    // Determine partial state for items with sub-issues
    ensureSubIssues(item);
    const sub = item.subIssues;
    const hasSub = sub && sub.length > 0;
    const subDone = hasSub ? sub.filter(s=>s.done).length : 0;
    const isPartial = hasSub && subDone > 0 && subDone < sub.length;

    const tr = document.createElement('tr');
    if (item.completed) tr.classList.add('completed-row');
    tr.onclick = () => toggleExpand(item.id);

    // Checkbox cell
    const checkCell = document.createElement('td');
    checkCell.className = 'check-cell';
    const boxClass = item.completed ? 'done' : (isPartial ? 'partial' : '');
    checkCell.innerHTML = `<span class="check-box ${boxClass}">${item.completed?'✓':(isPartial?'–':'')}</span>`;
    checkCell.onclick = e => { e.stopPropagation(); toggleComplete(item.id); };
    tr.appendChild(checkCell);

    for (const f of mainFields) {
      const td = document.createElement('td');
      td.className = 'truncate'+(item.completed?' strike':'');
      td.textContent = item[f.key]??'';
      tr.appendChild(td);
    }
    if (extraFields.length) {
      const td = document.createElement('td');
      td.style.color='var(--text2)';
      td.textContent = expandedId===item.id?'▲':'▼';
      tr.appendChild(td);
    }
    const delTd = document.createElement('td');
    delTd.innerHTML = `<button style="color:var(--text2);font-size:.8rem;opacity:.4" onclick="event.stopPropagation();deleteItem('${item.id}')">✕</button>`;
    tr.appendChild(delTd);
    body.appendChild(tr);

    // Expanded row
    if (expandedId === item.id) {
      const etr = document.createElement('tr');
      etr.className = 'expand-row';
      const etd = document.createElement('td');
      etd.colSpan = mainFields.length + (extraFields.length?1:0) + 2;

      // Sub-issues section
      let issuesHTML = '';
      if (hasSub) {
        const chips = sub.map((s,i) => `
          <span class="issue-chip ${s.done?'done':''}" onclick="toggleSubIssue('${item.id}',${i})">
            <span class="mini-check">${s.done?'✓':''}</span>
            ${esc(s.label)}
          </span>
        `).join('');
        const allDone = subDone === sub.length;
        issuesHTML = `
          <div class="issues-section">
            <div class="issues-header">
              <span class="issues-label">Issues (${subDone}/${sub.length})</span>
              <button class="btn-check-all" onclick="checkAllIssues('${item.id}')">${allDone?'Uncheck All':'Check All'}</button>
            </div>
            <div class="issues-grid">${chips}</div>
          </div>
        `;
      }

      // Meta fields (fields 1 onwards — skip the issues field which has index 3)
      const metaFields = c.fields.filter(f=>f.key!=='issues');
      const metaHTML = `<div class="expand-meta">${metaFields.map(f=>`
        <div><div class="expand-field-label">${esc(f.label)}</div><div class="expand-field-val">${esc(String(item[f.key]??'—'))}</div></div>
      `).join('')}</div>`;

      etd.innerHTML = `<div class="expand-inner">
        ${issuesHTML}
        ${metaHTML}
        <div class="expand-actions">
          <button class="${item.completed?'btn-incomplete':'btn-complete'}" onclick="toggleComplete('${item.id}')">${item.completed?'Mark Incomplete':'Mark Complete'}</button>
          <button class="btn-del-item" onclick="deleteItem('${item.id}')">Delete</button>
        </div>
      </div>`;
      etr.appendChild(etd);
      body.appendChild(etr);
    }
  }

  document.getElementById('table-footer').textContent = `Showing ${items.length} of ${c.items.length} items`;
}

function toggleSort(key) {
  if (sortField===key) sortDir=sortDir==='asc'?'desc':'asc';
  else { sortField=key; sortDir='asc'; }
  const c=getActive(); c.sortField=sortField; c.sortDir=sortDir; save();
  renderTable();
}

function toggleExpand(id) {
  expandedId = expandedId===id ? null : id;
  renderTable();
}

function toggleComplete(id) {
  const c = getActive();
  const item = c.items.find(i=>i.id===id);
  if (!item) return;
  item.completed = !item.completed;
  // If marking complete, also check all sub-issues
  ensureSubIssues(item);
  if (item.completed && item.subIssues) item.subIssues.forEach(s=>s.done=true);
  // If marking incomplete, uncheck all sub-issues
  if (!item.completed && item.subIssues) item.subIssues.forEach(s=>s.done=false);
  save(); updateProgress(); renderTable();
}

function toggleSubIssue(itemId, idx) {
  const c = getActive();
  const item = c.items.find(i=>i.id===itemId);
  if (!item) return;
  ensureSubIssues(item);
  item.subIssues[idx].done = !item.subIssues[idx].done;
  // Auto-complete arc when all issues checked
  const allDone = item.subIssues.every(s=>s.done);
  const noneDone = item.subIssues.every(s=>!s.done);
  if (allDone) item.completed = true;
  else if (noneDone) item.completed = false;
  save(); updateProgress(); renderTable();
}

function checkAllIssues(itemId) {
  const c = getActive();
  const item = c.items.find(i=>i.id===itemId);
  if (!item) return;
  ensureSubIssues(item);
  const allDone = item.subIssues.every(s=>s.done);
  item.subIssues.forEach(s=>s.done=!allDone);
  item.completed = !allDone;
  save(); updateProgress(); renderTable();
}

function deleteItem(id) {
  const c = getActive();
  c.items = c.items.filter(i=>i.id!==id);
  if (expandedId===id) expandedId=null;
  save(); updateProgress(); renderTable();
}

// ── Add item ───────────────────────────────────────────────────
function buildAddForm() {
  const c = getActive();
  document.getElementById('add-form-fields').innerHTML = c.fields.map(f=>`
    <div class="field-group">
      <label>${esc(f.label)}</label>
      <input class="field-input" type="${f.type==='number'?'number':'text'}" id="nf-${f.key}" placeholder="${esc(f.label)}">
    </div>
  `).join('');
}

function toggleAddForm() {
  const form = document.getElementById('add-form');
  form.classList.toggle('hidden');
  if (!form.classList.contains('hidden')) { buildAddForm(); form.querySelector('input')?.focus(); }
}

function saveNewItem() {
  const c = getActive();
  const item = {id:uid(), completed:false};
  for (const f of c.fields) {
    const el = document.getElementById('nf-'+f.key);
    item[f.key] = f.type==='number'?(Number(el.value)||0):(el.value||'');
  }
  c.items.push(item);
  save(); document.getElementById('add-form').classList.add('hidden');
  updateProgress(); renderTable();
}

// ── Create collection ──────────────────────────────────────────
let newFields = [];

function openCreateModal() {
  newFields = [{label:'Title',type:'text'}];
  renderFieldRows();
  document.getElementById('new-name').value='';
  document.getElementById('new-desc').value='';
  document.querySelectorAll('.cat-pill').forEach((p,i)=>p.classList.toggle('active',i===0));
  document.getElementById('create-modal').classList.remove('hidden');
}
function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }

function selectCat(btn) {
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
}

function addFieldRow() { newFields.push({label:'',type:'text'}); renderFieldRows(); }

function renderFieldRows() {
  document.getElementById('new-fields-list').innerHTML = newFields.map((f,i)=>`
    <div class="field-row">
      <input value="${esc(f.label)}" placeholder="Column name" oninput="newFields[${i}].label=this.value">
      <select onchange="newFields[${i}].type=this.value">
        <option value="text" ${f.type==='text'?'selected':''}>Text</option>
        <option value="number" ${f.type==='number'?'selected':''}>Number</option>
        <option value="url" ${f.type==='url'?'selected':''}>URL</option>
      </select>
      ${newFields.length>1?`<button class="btn-rm" onclick="removeField(${i})">✕</button>`:''}
    </div>
  `).join('');
}

function removeField(i) { newFields.splice(i,1); renderFieldRows(); }

function createCollection() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { document.getElementById('new-name').focus(); return; }
  const catBtn = document.querySelector('.cat-pill.active');
  const category = catBtn?catBtn.dataset.cat:'other';
  const fields = newFields.filter(f=>f.label.trim()).map(f=>({key:f.label.toLowerCase().replace(/\s+/g,'_'),label:f.label.trim(),type:f.type}));
  const c = {
    id:uid(), name, description:document.getElementById('new-desc').value.trim(),
    category, icon:CAT_ICONS[category]||'📋',
    fields: fields.length?fields:[{key:'title',label:'Title',type:'text'}],
    items:[], sortField:fields[0]?.key||'title', sortDir:'asc'
  };
  collections.push(c); save(); closeCreateModal(); openCollection(c.id);
}

// ── Delete collection ──────────────────────────────────────────
function confirmDeleteCollection() {
  const c = getActive();
  document.getElementById('confirm-text').innerHTML = `This will permanently delete <strong>${esc(c.name)}</strong> and all ${c.items.length} items.`;
  document.getElementById('confirm-modal').classList.remove('hidden');
}
function closeConfirm() { document.getElementById('confirm-modal').classList.add('hidden'); }
function deleteCollection() {
  collections = collections.filter(c=>c.id!==activeId);
  save(); closeConfirm(); showHome();
}

// ── Init ───────────────────────────────────────────────────────
load();
renderHome();
</script>
</body>
